<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Panerelay accessibility frame</title>
  </head>
  <body>
    <main>
      <h2>Accessible child frame</h2>
      <label for="frame-value">Frame value</label>
      <input id="frame-value" value="child-frame" />
      <button type="button">Frame action</button>
      <p>The unnamed button below is an intentional accessibility-audit fixture.</p>
      <button id="frame-unnamed-action" type="button"></button>
    </main>
  </body>
</html>
